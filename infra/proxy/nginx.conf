events {}

http {
  resolver 127.0.0.11 valid=10s ipv6=off;

  server {
    listen 80;
    server_name hc.local _;

    location ~ ^/api/mower/v3/firmware/(preflight|jobs)$ {
      client_max_body_size 17m;
      set $frontend_preflight http://frontend:3000;
      proxy_pass $frontend_preflight;
      proxy_http_version 1.1;
      proxy_set_header Host $http_host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
      proxy_connect_timeout 15s;
      proxy_send_timeout 60s;
      proxy_read_timeout 60s;
    }

    location = /api/ai/chat {
      proxy_request_buffering off;
      proxy_http_version 1.1;
      proxy_set_header Host $http_host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
      client_max_body_size 17m;
      set $ai_chat_upstream http://frontend:3000;
      proxy_pass $ai_chat_upstream;
      proxy_read_timeout 600s;
    }

    location / {
      set $frontend_upstream http://frontend:3000;
      proxy_pass $frontend_upstream;
      proxy_http_version 1.1;
      proxy_set_header Host $http_host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
      proxy_set_header Upgrade $http_upgrade;
      proxy_set_header Connection "upgrade";
      proxy_connect_timeout 15s;
      proxy_send_timeout 600s;
      proxy_read_timeout 600s;
    }
  }
}
