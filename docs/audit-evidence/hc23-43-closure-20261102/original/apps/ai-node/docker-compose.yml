services:
  ollama:
    image: ollama/ollama:latest
    container_name: homecontrol-ai-ollama
    restart: unless-stopped
    environment:
      TZ: ${TZ:-Europe/Budapest}
      OLLAMA_HOST: 0.0.0.0:11434
    volumes:
      - ollama_models:/root/.ollama
    ports:
      - "${OLLAMA_BIND:-0.0.0.0}:${OLLAMA_PORT:-11434}:11434"
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  open-webui:
    image: ghcr.io/open-webui/open-webui:main
    container_name: homecontrol-ai-open-webui
    profiles:
      - ui
    restart: unless-stopped
    environment:
      TZ: ${TZ:-Europe/Budapest}
      OLLAMA_BASE_URL: http://ollama:11434
    volumes:
      - openwebui_data:/app/backend/data
    ports:
      - "${OPENWEBUI_PORT:-3001}:8080"
    depends_on:
      - ollama
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  gitea:
    image: gitea/gitea:latest
    container_name: homecontrol-ai-gitea
    profiles:
      - git
    restart: unless-stopped
    environment:
      TZ: ${TZ:-Europe/Budapest}
      USER_UID: ${GITEA_UID:-1000}
      USER_GID: ${GITEA_GID:-1000}
      GITEA__server__ROOT_URL: ${GITEA_ROOT_URL:-http://192.168.1.2:3002/}
      GITEA__database__DB_TYPE: sqlite3
    volumes:
      - ${GITEA_DATA_DIR:-/mnt/hc-backup/gitea}:/data
    ports:
      - "${GITEA_HTTP_PORT:-3002}:3000"
      - "${GITEA_SSH_PORT:-2222}:22"
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  ollama_models:
  openwebui_data:
